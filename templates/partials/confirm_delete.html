{% extends "base.html" %}
{% block page_title %}Confirm delete{% endblock %}
{% block content %}
<div class="form-card">
  <h2 class="section-heading">Delete {{ object }}?</h2>
  <p style="color:var(--text-muted);">This action can't be undone. This will permanently remove this record and any data linked to it.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{{ request.META.HTTP_REFERER|default:'/' }}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
